 fill="#666965" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="21" font-weight="400">63.1 ms</text><text x="70" y="690" text-anchor="start" fill="#666965" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="18" font-weight="400">Each library ran 659 pages in one warm, sequential process after 10 warm-up pages.</text><text x="70" y="724" text-anchor="start" fill="#666965" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="18" font-weight="400">Time includes HTML parsing, extraction, and conversion to field text; excludes file I/O/import.</text><text x="70" y="758" text-anchor="start" fill="#666965" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="18" font-weight="400">Node v26.4.0; Apple M4 Pro. Python tools used separate uv environments.</text><text x="70" y="855" text-anchor="start" fill="#666965" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="18" font-weight="400">Engineering Universe · same 659 saved HTML pages · no live fetches</text></svg>