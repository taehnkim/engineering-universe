services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: eng_universe
      POSTGRES_USER: eng_universe
      POSTGRES_PASSWORD: eng_universe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eng_universe -d eng_universe"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-v2
    ports:
      - "6379:6379"
    command:
      [
        "redis-stack-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "devpass",
      ]

  crawler:
    build: .
    command: ["python", "main.py", "crawl"]
    environment:
      REDIS_URL: redis://default:devpass@redis:6379/0
      MAX_WORKERS: "200"
      SEED_START_URLS: "https://engineering.fb.com/"
    depends_on:
      - redis
    profiles: ["crawler"]

  indexer:
    build: .
    command: ["python", "main.py", "index"]
    environment:
      REDIS_URL: redis://default:devpass@redis:6379/0
      INDEXER_EXIT_ON_IDLE: "false"
    depends_on:
      - redis
    profiles: ["indexer"]

  api:
    build: .
    command: ["uvicorn", "api.search:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://default:devpass@redis:6379/0
    depends_on:
      - redis
    profiles: ["api"]

  metrics:
    build: .
    command: ["python", "main.py", "metrics"]
    ports:
      - "9100:9100"
    environment:
      METRICS_PORT: "9100"
    profiles: ["metrics"]

  seed:
    build: .
    command: ["python", "main.py", "seed"]
    environment:
      REDIS_URL: redis://default:devpass@redis:6379/0
      SEED_START_URLS: "https://engineering.fb.com/"
    depends_on:
      - redis
    profiles: ["seed"]

volumes:
  postgres_data:
